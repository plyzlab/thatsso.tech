<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gatecheck Shield Test</title>

  <!-- Gatecheck Shield Script -->
  <script src="https://gatecheck.me/shield.js?key=pk_live_a762235646f32180efd5ecdab2390a7ee233c31e2a47a730e2e43b8555de7465"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 640px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      line-height: 1.6;
      color: #1f2937;
    }
    .card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 1.5rem;
      background: #f9fafb;
    }
    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #111827;
      background: #111827;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #374151;
    }
    pre {
      background: #111827;
      color: #f3f4f6;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <h1>Gatecheck Shield Test Page</h1>
  <p>This page loads your shield script so you can inspect network requests, console logs, and any UI or protection behavior.</p>

  <div class="card">
    <h2>Test Actions</h2>
    <p>Try interacting with the page or submitting a test action below:</p>
    <form id="test-form">
      <label for="test-input">Test Field:</label><br />
      <input id="test-input" type="text" placeholder="Type something..." style="padding: 0.5rem; margin: 0.5rem 0 1rem; width: 100%; box-sizing: border-box;" />
      <br />
      <button type="submit">Submit Test</button>
    </form>
  </div>

  <h3>Debug Info</h3>
  <pre id="debug-output">Waiting for events...</pre>

  <script>
    const output = document.getElementById('debug-output');
    const form = document.getElementById('test-form');

    function log(msg) {
      output.textContent += '\n' + msg;
    }

    window.addEventListener('DOMContentLoaded', () => {
      output.textContent = 'DOMContentLoaded fired.';
    });

    window.addEventListener('load', () => {
      log('Window load fired.');
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('test-input').value;
      log('Form submitted with value: ' + JSON.stringify(val));
    });
  </script>
</body>
</html>
