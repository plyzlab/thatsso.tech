<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Gatecheck Test</title>

  <script>
    window.__PRE_SHIELD_KEYS = new Set(Object.keys(window));
  </script>

  <!-- Gatecheck Shield Script -->
  <script src="https://gatecheck.me/shield.js?key=pk_live_a762235646f32180efd5ecdab2390a7ee233c31e2a47a730e2e43b8555de7465"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1.25rem;
      background: #f3f4f6;
      color: #1f2937;
    }
    nav { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
    nav a {
      text-decoration: none; padding: 0.45rem 0.9rem; border-radius: 6px;
      background: #fff; border: 1px solid #d1d5db; color: #111827; font-weight: 500; font-size: 0.9rem;
    }
    nav a.active { background: #111827; color: #fff; border-color: #111827; }
    .badge {
      margin-left: auto; padding: 0.3rem 0.7rem; border-radius: 999px;
      font-size: 0.8rem; font-weight: 600; background: #dcfce7; color: #166534;
    }
    .badge.removed { background: #fee2e2; color: #991b1b; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.25rem; }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%; padding: 0.55rem 0.7rem; margin: 0.3rem 0 0.9rem;
      border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem;
    }
    .btn-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    button {
      padding: 0.5rem 0.9rem; font-size: 0.875rem; border-radius: 6px;
      border: 1px solid #111827; background: #111827; color: #fff; cursor: pointer;
    }
    button.danger { background: #b91c1c; border-color: #b91c1c; }
    button.secondary { background: #fff; color: #111827; border-color: #d1d5db; }
    .terminal {
      background: #0d1117; color: #e6edf3; border-radius: 10px; overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.84rem;
    }
    .terminal-bar {
      background: #161b22; padding: 0.5rem 0.9rem; border-bottom: 1px solid #30363d;
      display: flex; justify-content: space-between; color: #8b949e; font-size: 0.78rem;
    }
    #terminal-output { height: 220px; overflow-y: auto; padding: 0.85rem; white-space: pre-wrap; word-break: break-word; }
    .terminal-input-row { display: flex; border-top: 1px solid #30363d; padding: 0.45rem 0.85rem; gap: 0.5rem; }
    .terminal-input-row span { color: #58a6ff; font-weight: bold; }
    #terminal-input {
      flex: 1; background: transparent; border: none; color: #e6edf3; outline: none;
      font-family: inherit; font-size: 0.85rem;
    }
    .log-info { color: #e6edf3; } .log-ok { color: #3fb950; }
    .log-warn { color: #d29922; } .log-err { color: #f85149; } .log-cmd { color: #58a6ff; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Console</a>
    <a href="login.html">Login Page</a>
    <a href="signup.html" class="active">Sign Up Page</a>
    <span id="shield-status" class="badge">Shield Tag: Checking...</span>
  </nav>

  <div class="card">
    <h1 style="margin-top:0;">Create Account</h1>
    <form id="signup-form" data-endpoint="/api/signup">
      <label for="signup-user">Username</label>
      <input id="signup-user" name="username" type="text" required placeholder="testuser99" />

      <label for="signup-email">Email</label>
      <input id="signup-email" name="email" type="email" required placeholder="newuser@example.com" />

      <label for="signup-password">Password</label>
      <input id="signup-password" name="password" type="password" required placeholder="••••••••" />

      <button type="submit">Sign Up</button>
    </form>

    <div class="btn-grid" style="margin-top:1rem;">
      <button data-cmd="bot-submit">Bot Auto-SignUp</button>
      <button data-cmd="remove-script" class="danger">Remove Shield &lt;script&gt;</button>
      <button data-cmd="strip-dom" class="danger">Strip Injected DOM</button>
      <button data-cmd="nuke-globals" class="danger">Nuke Globals</button>
      <button data-cmd="status" class="secondary">Status</button>
    </div>
  </div>

  <div class="terminal">
    <div class="terminal-bar">
      <span>signup-test-terminal (type "help")</span>
      <span id="hook-indicator">fetch: checking...</span>
    </div>
    <div id="terminal-output"></div>
    <form id="terminal-form" class="terminal-input-row">
      <span>$</span>
      <input id="terminal-input" type="text" autocomplete="off" placeholder="remove-script | bot-submit | status" />
    </form>
  </div>

  <script src="tester.js"></script>
</body>
</html>
